<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کافه آوین | منو</title>
<meta name="description" content="منوی کافه آوین، کنار دریاچه و جنگل">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap">
<style>
:root{--mist:#eef4ee;--sage:#a9c7b0;--lake:#bfdde2;--peach:#f6dccb;--pine:#2f4a3f;--gold:#c9a66b;--ink:#35524a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--mist);color:var(--ink);line-height:1.8}
.hero{position:relative;min-height:92vh;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(#2f4a3f55,#2f4a3f99),url(img/hero.jpg) center/cover}
.hero h1{font-size:clamp(4rem,18vw,9rem);font-weight:800;line-height:1.1;text-shadow:0 6px 30px #0006}
.hero p{font-weight:300;font-size:1.2rem;letter-spacing:.02em}
.hero a{display:inline-block;margin-top:1.4rem;padding:.6rem 1.8rem;border-radius:99px;background:var(--peach);color:var(--pine);text-decoration:none;font-weight:500}
.cup{position:absolute;bottom:26px;left:26px;width:70px;height:60px}
.cup i{position:absolute;bottom:0;width:60px;height:38px;background:#fff;border-radius:4px 4px 30px 30px;left:0}
.cup i:after{content:"";position:absolute;right:-16px;top:6px;width:18px;height:18px;border:5px solid #fff;border-radius:50%}
.cup b{position:absolute;bottom:34px;width:8px;height:34px;border-radius:50%;background:#ffffffaa;filter:blur(5px);animation:st 3s infinite ease-out;opacity:0}
.cup b:nth-child(1){left:14px}.cup b:nth-child(2){left:28px;animation-delay:1s}.cup b:nth-child(3){left:42px;animation-delay:2s}
@keyframes st{0%{transform:translateY(0) scaleX(1);opacity:0}30%{opacity:.8}100%{transform:translateY(-50px) scaleX(2.4);opacity:0}}
nav{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 1rem;background:#eef4eecc;backdrop-filter:blur(10px)}
nav button{flex:none;font:inherit;border:0;padding:.4rem 1.1rem;border-radius:99px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px #2f4a3f14}
nav button.on{background:var(--sage);color:var(--pine);font-weight:800}
nav button:focus-visible,.hero a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{max-width:980px;margin:auto;padding:1.5rem 1rem 4rem;min-height:60vh}
h2{font-size:2rem;color:var(--pine);margin-bottom:.3rem}
.note{font-size:.95rem;opacity:.75;margin-bottom:1rem}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.2rem 2.5rem}
.row{display:flex;align-items:baseline;gap:.6rem;padding:.55rem 0}
.row:after{content:"";order:1;flex:1;border-bottom:2px dotted var(--sage)}
.row span{order:0}.row em{order:2;font-style:normal;font-weight:800;color:var(--pine);white-space:nowrap}
.row em small{font-weight:300;font-size:.7rem;margin-inline-start:.2rem;opacity:.7}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.4rem}
.card{background:#fff;border-radius:28px 28px 28px 8px;padding:1.4rem;text-align:center;box-shadow:0 10px 30px #2f4a3f1a}
.card em{display:block;font-style:normal;font-weight:800;font-size:1.2rem;color:var(--pine)}
.card .e{font-size:2.6rem;display:block}
.card p{font-size:.9rem;opacity:.75}
.food{background:var(--pine);margin:0 -1rem;padding:1.5rem 1rem 2rem;border-radius:32px;color:var(--gold)}
.food h2,.food em{color:var(--gold)}
.fd{perspective:800px}
.fd .in{background:#1f332a;border:1px solid #c9a66b66;border-radius:18px;padding:1.5rem 1rem;text-align:center;transform:rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .15s;transform-style:preserve-3d;box-shadow:0 20px 40px #0005}
.plate{width:120px;height:120px;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;font-size:3rem;background:radial-gradient(circle at 35% 30%,#4a6155,#16241d 70%);box-shadow:0 14px 24px #0008,inset 0 0 0 6px #c9a66b44;transform:translateZ(40px)}
.fd .in b{display:block;color:#f3e6c9;font-weight:500;transform:translateZ(25px)}
.fd p{color:#c9a66bcc}
.hk .card{background:linear-gradient(#fff,var(--peach))}
.sea{position:relative;height:300px;border-radius:32px;overflow:hidden;margin-bottom:1.5rem;background:linear-gradient(#bfdde288,#7fb6c0aa),url(img/lake.jpg) center 60%/cover}
.sea svg{position:absolute;width:90px;bottom:48px;animation:sail 16s linear infinite alternate}
.sea svg:nth-child(2){bottom:80px;width:70px;animation-duration:22s;animation-delay:-8s}
.sea svg:nth-child(3){bottom:30px;width:80px;animation-duration:19s;animation-delay:-3s}
@keyframes sail{from{right:-10%;transform:translateY(0)}50%{transform:translateY(-6px)}to{right:90%;transform:translateY(0)}}
.wave{position:absolute;bottom:0;width:200%;height:40px;background:radial-gradient(circle at 20px -8px,transparent 22px,#ffffffaa 23px) 0 0/40px 40px;animation:wv 6s linear infinite}
@keyframes wv{to{transform:translateX(-40px)}}
.act{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4rem}
.act div{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px #2f4a3f1a}
.act img{width:100%;height:240px;object-fit:cover;display:block}
.act section{padding:1rem 1.2rem}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:3rem}
.strip img{width:100%;height:240px;object-fit:cover;border-radius:28px}
footer{text-align:center;padding:2rem 1rem 5rem;color:var(--pine);background:var(--lake)}
#rain{position:fixed;inset:0;pointer-events:none;z-index:4}
#rt{position:fixed;bottom:16px;right:16px;z-index:6;width:48px;height:48px;border:0;border-radius:50%;background:#fff;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 16px #0003}
@media(max-width:560px){.strip{grid-template-columns:1fr}.cup{left:14px;bottom:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="hero">
 <div><p>کنار دریاچه، میان جنگل</p><h1>آوین</h1><p>کافه • قلیان • تفریحات آبی</p><a href="#menu">دیدن منو</a></div>
 <div class="cup" aria-hidden="true"><b></b><b></b><b></b><i></i></div>
</header>
<nav id="tabs" aria-label="دسته‌بندی منو"></nav>
<main id="menu"></main>
<div style="max-width:980px;margin:auto;padding:0 1rem 3rem"><div class="strip"><img src="img/cabin.jpg" alt="فضای چوبی کافه آوین رو به دریاچه" loading="lazy"><img src="img/lake.jpg" alt="دریاچه و جنگل" loading="lazy"></div></div>
<footer><b>کافه آوین</b><br>لحظه‌های خوب را با آوین تجربه کنید</footer>
<canvas id="rain"></canvas>
<button id="rt" aria-label="روشن یا خاموش کردن بارون" title="بارون">🌧</button>
<svg width="0" height="0" style="position:absolute"><symbol id="pb" viewBox="0 0 90 50"><path d="M4 28h82l-10 16H16z" fill="#fff"/><path d="M4 28h82" stroke="#f6dccb" stroke-width="5"/><rect x="30" y="10" width="30" height="18" rx="9" fill="#f6dccb"/><path d="M8 44q37 8 74 0" fill="none" stroke="#ffffff99" stroke-width="3"/></symbol></svg>
<script>
const $=s=>document.querySelector(s),fa=n=>n.toLocaleString('fa-IR');
const price=(p,u)=>p==null?'<em>بپرسید</em>':`<em>${fa(p)}<small>${u}</small></em>`;
function render(c,u){
 const it=c.items;let h=`<h2>${c.title}</h2>`+(c.note?`<p class="note">${c.note}</p>`:'');
 if(c.id=='food')h=`<div class="food">${h}<div class="cards">`+it.map(i=>`<div class="fd"><div class="in"><div class="plate">${i.e}</div><b>${i.n}</b><p>${i.d||'&nbsp;'}</p>${price(i.p,u)}</div></div>`).join('')+'</div></div>';
 else if(c.id=='hookah')h+=`<div class="cards hk">`+it.map(i=>`<div class="card"><span class="e">${i.e}</span><b>${i.n}</b><p>${i.d||'&nbsp;'}</p>${price(i.p,u)}</div>`).join('')+'</div>';
 else if(c.id=='water')h+=`<div class="sea" role="img" aria-label="قایق‌های پدالی روی دریاچه"><svg><use href="#pb"/></svg><svg><use href="#pb"/></svg><svg><use href="#pb"/></svg><div class="wave"></div></div><div class="act">`+it.map(i=>`<div><img src="${i.img}" alt="${i.n}" loading="lazy"><section><b>${i.n}</b><p>${i.d}</p>${price(i.p,u)}</section></div>`).join('')+'</div>';
 else h+=`<div class="list">`+it.map(i=>`<div class="row"><span>${i.n}</span>${price(i.p,u)}</div>`).join('')+'</div>';
 $('#menu').innerHTML=h;
 document.querySelectorAll('.fd').forEach(f=>{const n=f.firstChild;
  f.onpointermove=e=>{const r=f.getBoundingClientRect();n.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*16+'deg');n.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*16+'deg')};
  f.onpointerleave=()=>{n.style.setProperty('--rx','0deg');n.style.setProperty('--ry','0deg')}});
}
fetch('menu.json').then(r=>r.json()).then(m=>{
 $('#tabs').innerHTML=m.categories.map((c,i)=>`<button data-i="${i}">${c.title}</button>`).join('');
 const go=i=>{document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j));render(m.categories[i],m.unit)};
 $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){go(+b.dataset.i);$('#menu').scrollIntoView()}};
 go(0);
}).catch(()=>$('#menu').innerHTML='<p>منو بارگذاری نشد. صفحه را دوباره باز کنید.</p>');
const cv=$('#rain'),x=cv.getContext('2d');let on=!matchMedia('(prefers-reduced-motion:reduce)').matches,d=[];
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight;d=Array.from({length:Math.min(140,innerWidth/6)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,l:10+Math.random()*14,s:6+Math.random()*6}))};
addEventListener('resize',rs);rs();
(function f(){x.clearRect(0,0,cv.width,cv.height);if(on){x.strokeStyle='rgba(140,185,205,.7)';x.lineWidth=1.2;x.beginPath();d.forEach(p=>{x.moveTo(p.x,p.y);x.lineTo(p.x-2,p.y+p.l);p.y+=p.s;if(p.y>cv.height){p.y=-20;p.x=Math.random()*cv.width}});x.stroke()}requestAnimationFrame(f)})();
$('#rt').onclick=()=>on=!on;
</script>
</body>
</html>
